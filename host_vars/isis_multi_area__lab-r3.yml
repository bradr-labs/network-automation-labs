lab_name: lab-r3
device_role: pe
jcl_node: vmx3

loopback:
  ipv4: 10.100.100.3/32

underlay:
  isis:
    enabled: true
    net: "49.0002.1010.0100.0003.00"
    level: "2"
    level_1_disable_global: false
    interfaces:
      - ge-0/0/0.0
      - ge-0/0/1.0
      - lo0.0

  mpls:
    enabled: true
    interface_mode: listed
    interfaces:
      - ge-0/0/0.0

    lsp:
      - name: R3-TO-R5
        to: 10.100.100.5

    ldp:
      enabled: false
      interfaces: []

    rsvp:
      enabled: true
      interfaces:
        - ge-0/0/0.0

device_interfaces:
  - name: ge-0/0/0
    unit: 0
    description: "to lab-r1"
    family_inet:
      address: 10.100.13.2/24
    family_iso: true
    family_mpls: true

  - name: ge-0/0/1
    unit: 0
    description: "to lab-r2"
    disabled: true
    family_inet:
      address: 10.100.23.2/24
    family_iso: true

  - name: ge-0/0/2
    unit: 0
    description: "to customer"
    family_inet:
      address: 10.100.34.1/24

  - name: fxp0
    unit: 0
    description: "management"
    family_inet:
      address: 100.123.1.2/16

  - name: lo0
    unit: 0
    description: "loopback"
    family_inet:
      address: 10.100.100.3/32
    family_iso_address: "49.0002.1010.0100.0003.00"

routing_options:
  static_routes:
    - prefix: "0.0.0.0/0"
      next_hop: "100.123.0.1"

bgp:
  enabled: true
  role: client
  local_as: 65000
  local_address: 10.100.100.3
  family_inet_vpn: true
  neighbors:
    - 10.100.100.2
  l3vpn_resolution:
    enabled: false
    source_rib: ""
    resolution_ribs: []

vpn_services:
  enabled: true
  vrfs:
    - name: cust-a
      interface: ge-0/0/2.0
      route_distinguisher: "10.100.100.3:1"
      vrf_target: "target:65000:1"
      vrf_table_label: false
      ce_bgp:
        enabled: true
        group_name: EBGP
        peer_as: 65004
        neighbor: 10.100.34.2