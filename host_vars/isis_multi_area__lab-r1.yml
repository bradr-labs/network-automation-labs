lab_name: lab-r1
device_role: p
jcl_node: vmx1

loopback:
  ipv4: 10.100.100.1/32

underlay:
  isis:
    enabled: true
    net: "49.0001.1010.0100.0001.00"
    level: "2"
    level_1_disable_global: true
    interfaces:
      - ge-0/0/0.0
      - ge-0/0/1.0
      - ge-0/0/2.0
      - lo0.0

  mpls:
    enabled: true
    interface_mode: all
    interfaces: []
    lsp: []
    ldp:
      enabled: false
      interfaces: []
    rsvp:
      enabled: true
      interfaces:
        - ge-0/0/0.0
        - ge-0/0/1.0

device_interfaces:
  - name: ge-0/0/0
    unit: 0
    description: "to lab-r3"
    family_inet:
      address: 10.100.13.1/24
    family_iso: true
    family_mpls: true

  - name: ge-0/0/1
    unit: 0
    description: "to lab-r5"
    family_inet:
      address: 10.100.15.1/24
    family_iso: true
    family_mpls: true

  - name: ge-0/0/2
    unit: 0
    description: "to lab-r2"
    family_inet:
      address: 10.100.12.1/24
    family_iso: true
    family_mpls: true

  - name: fxp0
    unit: 0
    description: "management"
    family_inet:
      address: 100.123.1.0/16

  - name: lo0
    unit: 0
    description: "loopback"
    family_inet:
      address: 10.100.100.1/32
    family_iso_address: "49.0001.1010.0100.0001.00"

routing_options:
  static_routes:
    - prefix: "0.0.0.0/0"
      next_hop: "100.123.0.1"

vpn_services:
  enabled: false
  vrfs: []