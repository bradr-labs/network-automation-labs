# labs/05-policy-driven-bgp-drift-detection/policy_matrix.yml

lab:
  id: 5
  slug: 05-policy-driven-bgp-drift-detection
  name: Policy-Driven BGP with Drift Detection

policy_matrix:
  description: >
    Human-readable policy map for Lab 05. This file describes intended BGP
    relationships, import/export policy assignments, and preferred-versus-backup
    path behavior across the 3-AS topology.

  path_selection_summary:
    from_as65222_to_as65444:
      preferred_path: transit_via_as65333
      backup_path: direct_edge_to_as65444
      preferred_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL

    from_as65444_to_as65222:
      preferred_path: transit_via_as65333
      backup_path: direct_edge_to_as65222
      preferred_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL

  relationships:
    - session_name: vmx2-to-vmx4
      local_router: vMX2
      local_as: 65222
      remote_router: vMX4
      remote_as: 65333
      relationship_type: edge_to_transit
      direction_purpose: learn selected AS65444 routes via transit
      import_policy:
        - IMPORT-FROM-TRANSIT-PREFERRED
      export_policy:
        - EXPORT-AS65222
      expected_path_role: preferred
      expected_local_pref: 250
      allowed_inbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      notes: >
        Border router in AS65222 learns approved AS65444 routes through transit.
        This path should beat the direct AS65444 path for selected remote prefixes.

    - session_name: vmx3-to-vmx4
      local_router: vMX3
      local_as: 65222
      remote_router: vMX4
      remote_as: 65333
      relationship_type: edge_to_transit
      direction_purpose: learn selected AS65444 routes via transit
      import_policy:
        - IMPORT-FROM-TRANSIT-PREFERRED
      export_policy:
        - EXPORT-AS65222
      expected_path_role: preferred
      expected_local_pref: 250
      allowed_inbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      notes: >
        Same intended role as vmx2-to-vmx4. Both AS65222 border routers should
        prefer transit-learned selected AS65444 routes.

    - session_name: vmx4-to-vmx2
      local_router: vMX4
      local_as: 65333
      remote_router: vMX2
      remote_as: 65222
      relationship_type: transit_to_edge
      direction_purpose: accept approved AS65222 routes into transit
      import_policy:
        - IMPORT-INTO-TRANSIT-FROM-AS65222
      export_policy:
        - EXPORT-AS65333-TRANSIT
      expected_path_role: transit_learning
      allowed_inbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      notes: >
        Transit accepts only approved AS65222 routes and may re-advertise only
        approved AS65444 routes back toward AS65222.

    - session_name: vmx4-to-vmx3
      local_router: vMX4
      local_as: 65333
      remote_router: vMX3
      remote_as: 65222
      relationship_type: transit_to_edge
      direction_purpose: accept approved AS65222 routes into transit
      import_policy:
        - IMPORT-INTO-TRANSIT-FROM-AS65222
      export_policy:
        - EXPORT-AS65333-TRANSIT
      expected_path_role: transit_learning
      allowed_inbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      notes: >
        Same role as vmx4-to-vmx2. Transit should not become an unrestricted
        route reflector or blanket permit point.

    - session_name: vmx2-to-vmx5
      local_router: vMX2
      local_as: 65222
      remote_router: vMX5
      remote_as: 65444
      relationship_type: direct_edge
      direction_purpose: learn selected AS65444 routes over direct adjacency
      import_policy:
        - IMPORT-FROM-DIRECT-EDGE-BACKUP
      export_policy:
        - EXPORT-AS65222
      expected_path_role: backup
      expected_local_pref: 175
      allowed_inbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      notes: >
        Direct edge path is valid but should lose to the transit path for the
        selected remote AS65444 prefix sets.

    - session_name: vmx3-to-vmx5
      local_router: vMX3
      local_as: 65222
      remote_router: vMX5
      remote_as: 65444
      relationship_type: direct_edge
      direction_purpose: learn selected AS65444 routes over direct adjacency
      import_policy:
        - IMPORT-FROM-DIRECT-EDGE-BACKUP
      export_policy:
        - EXPORT-AS65222
      expected_path_role: backup
      expected_local_pref: 175
      allowed_inbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      notes: >
        Same intended role as vmx2-to-vmx5. Direct path remains available for
        failover or alternate routing outcome.

    - session_name: vmx4-to-vmx6
      local_router: vMX4
      local_as: 65333
      remote_router: vMX6
      remote_as: 65444
      relationship_type: transit_to_edge
      direction_purpose: accept approved AS65444 routes into transit
      import_policy:
        - IMPORT-INTO-TRANSIT-FROM-AS65444
      export_policy:
        - EXPORT-AS65333-TRANSIT
      expected_path_role: transit_learning
      allowed_inbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      notes: >
        Transit accepts only approved AS65444 routes and may re-advertise only
        approved AS65222 routes toward AS65444.

    - session_name: vmx6-to-vmx4
      local_router: vMX6
      local_as: 65444
      remote_router: vMX4
      remote_as: 65333
      relationship_type: edge_to_transit
      direction_purpose: learn selected AS65222 routes via transit
      import_policy:
        - IMPORT-FROM-TRANSIT-INTO-AS65444
      export_policy:
        - EXPORT-AS65444
      expected_path_role: preferred
      expected_local_pref: 250
      allowed_inbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      notes: >
        AS65444 should prefer selected AS65222 routes when learned through the
        transit path rather than over direct edge adjacencies.

    - session_name: vmx5-to-vmx2
      local_router: vMX5
      local_as: 65444
      remote_router: vMX2
      remote_as: 65222
      relationship_type: direct_edge
      direction_purpose: learn selected AS65222 routes over direct adjacency
      import_policy:
        - IMPORT-FROM-AS65222-DIRECT
      export_policy:
        - EXPORT-AS65444
      expected_path_role: backup
      expected_local_pref: 175
      allowed_inbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      notes: >
        Direct return path from AS65444 toward AS65222 is valid but should be
        less preferred than selected transit-learned paths.

    - session_name: vmx5-to-vmx3
      local_router: vMX5
      local_as: 65444
      remote_router: vMX3
      remote_as: 65222
      relationship_type: direct_edge
      direction_purpose: learn selected AS65222 routes over direct adjacency
      import_policy:
        - IMPORT-FROM-AS65222-DIRECT
      export_policy:
        - EXPORT-AS65444
      expected_path_role: backup
      expected_local_pref: 175
      allowed_inbound_prefix_sets:
        - PL-AS65222-LOOPBACKS
        - PL-AS65222-INTERNAL
      allowed_outbound_prefix_sets:
        - PL-AS65444-LOOPBACKS
        - PL-AS65444-INTERNAL
      notes: >
        Same intended role as vmx5-to-vmx2. Direct path exists for alternate
        reachability but is not the selected preferred path in the base design.

  policy_objects:
    import_policies:
      - name: IMPORT-FROM-TRANSIT-PREFERRED
        role: prefer_selected_remote_routes_via_transit
        local_pref: 250
        allowed_prefix_sets:
          - PL-AS65444-LOOPBACKS
          - PL-AS65444-INTERNAL
        default_action: reject

      - name: IMPORT-FROM-DIRECT-EDGE-BACKUP
        role: accept_selected_remote_routes_via_direct_edge_as_backup
        local_pref: 175
        allowed_prefix_sets:
          - PL-AS65444-LOOPBACKS
          - PL-AS65444-INTERNAL
        default_action: reject

      - name: IMPORT-INTO-TRANSIT-FROM-AS65222
        role: permit_only_approved_as65222_routes_into_transit
        allowed_prefix_sets:
          - PL-AS65222-LOOPBACKS
          - PL-AS65222-INTERNAL
        default_action: reject

      - name: IMPORT-INTO-TRANSIT-FROM-AS65444
        role: permit_only_approved_as65444_routes_into_transit
        allowed_prefix_sets:
          - PL-AS65444-LOOPBACKS
          - PL-AS65444-INTERNAL
        default_action: reject

      - name: IMPORT-FROM-AS65222-DIRECT
        role: accept_selected_as65222_routes_via_direct_edge_as_backup
        local_pref: 175
        allowed_prefix_sets:
          - PL-AS65222-LOOPBACKS
          - PL-AS65222-INTERNAL
        default_action: reject

      - name: IMPORT-FROM-TRANSIT-INTO-AS65444
        role: prefer_selected_as65222_routes_via_transit
        local_pref: 250
        allowed_prefix_sets:
          - PL-AS65222-LOOPBACKS
          - PL-AS65222-INTERNAL
        default_action: reject

    export_policies:
      - name: EXPORT-AS65222
        role: advertise_only_approved_as65222_routes
        allowed_prefix_sets:
          - PL-AS65222-LOOPBACKS
          - PL-AS65222-INTERNAL
        default_action: reject

      - name: EXPORT-AS65444
        role: advertise_only_approved_as65444_routes
        allowed_prefix_sets:
          - PL-AS65444-LOOPBACKS
          - PL-AS65444-INTERNAL
        default_action: reject

      - name: EXPORT-AS65333-TRANSIT
        role: re_advertise_only_approved_routes_between_edge_domains
        allow_transit_between:
          - 65222
          - 65444
        allowed_prefix_sets:
          - PL-AS65222-LOOPBACKS
          - PL-AS65222-INTERNAL
          - PL-AS65444-LOOPBACKS
          - PL-AS65444-INTERNAL
        default_action: reject

  validation_intent:
    bgp_sessions_must_establish:
      - vmx2-to-vmx4
      - vmx3-to-vmx4
      - vmx4-to-vmx2
      - vmx4-to-vmx3
      - vmx2-to-vmx5
      - vmx3-to-vmx5
      - vmx4-to-vmx6
      - vmx6-to-vmx4
      - vmx5-to-vmx2
      - vmx5-to-vmx3

    preferred_routing_outcomes:
      - source_router: vMX1
        destination_prefix: 10.100.56.0/24
        expected_best_path: transit
        acceptable_backup: direct

      - source_router: vMX6
        destination_prefix: 10.100.12.0/24
        expected_best_path: transit
        acceptable_backup: direct

    drift_scope:
      managed_sections:
        - protocols bgp
        - policy-options
        - routing-options
      compare_mode: intended_vs_actual
      initial_behavior: report_only