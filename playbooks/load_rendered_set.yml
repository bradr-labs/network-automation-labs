---
- name: Load rendered set configs to Junos routers
  hosts: junos
  gather_facts: false
  connection: local

  vars:
    junos_user: jcluser

  vars_prompt:
    - name: DEVICE_PASSWORD
      prompt: "Device password"
      private: yes

  tasks:
    - name: Push rendered set config
      juniper.device.config:
        host: "{{ ansible_host }}"
        user: "{{ junos_user }}"
        passwd: "{{ DEVICE_PASSWORD }}"
        port: "{{ ansible_port }}"
        ssh_config: "/tmp/blank_ssh_config"
        src: "{{ cfg_file }}"
        load: set
        comment: "Load rendered config (set)"