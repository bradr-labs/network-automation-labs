---
- name: Set hostnames on Junos routers
  hosts: junos
  gather_facts: false
  connection: local

  vars:
    junos_user: "jcluser"

  vars_prompt:
    - name: DEVICE_PASSWORD
      prompt: "Device password"
      private: yes

  tasks:
    - name: Set system host-name
      no_log: true
      juniper.device.config:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port }}"
        user: "{{ junos_user }}"
        passwd: "{{ DEVICE_PASSWORD }}"
        load: set
        lines:
          - "set system host-name {{ inventory_hostname }}"
        comment: "Set hostname from Ansible lab"
        commit: true

    - name: Verify hostname
      no_log: true
      juniper.device.command:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port }}"
        user: "{{ junos_user }}"
        passwd: "{{ DEVICE_PASSWORD }}"
        commands:
          - "show configuration system host-name | display set"
      register: verify_result

    - name: Print verify output
      ansible.builtin.debug:
        var: verify_result.stdout_lines