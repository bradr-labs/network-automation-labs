---
- name: Compare Lab 05 rendered intent against collected live config
  hosts: all
  gather_facts: false

  vars_files:
    - ../labs/05-policy-driven-bgp-drift-detection/intent.yml

  vars:
    lab05_render_dir: "{{ playbook_dir }}/../rendered/lab05"
    lab05_collect_dir: "{{ playbook_dir }}/../staging/lab05/collected"
    lab05_diff_dir: "{{ playbook_dir }}/../staging/lab05/diffs"

  tasks:
    - name: Resolve Lab 05 logical router for this inventory host
      ansible.builtin.set_fact:
        lab05_router_name: >-
          {{
            (
              routers
              | dict2items
              | selectattr('value.inventory_host', 'equalto', inventory_hostname)
              | map(attribute='key')
              | first
            ) | default('')
          }}

    - name: Skip routers not defined in Lab 05 intent
      ansible.builtin.meta: end_host
      when: lab05_router_name == ''

    - name: Skip routers without BGP enabled for Lab 05
      ansible.builtin.meta: end_host
      when: not (routers[lab05_router_name].bgp.enabled | default(false))

    - name: Ensure Lab 05 diff output directory exists
      ansible.builtin.file:
        path: "{{ lab05_diff_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Check rendered config exists
      ansible.builtin.stat:
        path: "{{ lab05_render_dir }}/{{ lab05_router_name }}.set"
      register: lab05_render_stat
      delegate_to: localhost

    - name: Check collected config exists
      ansible.builtin.stat:
        path: "{{ lab05_collect_dir }}/{{ lab05_router_name }}.set"
      register: lab05_collect_stat
      delegate_to: localhost

    - name: Fail if rendered config is missing
      ansible.builtin.fail:
        msg: "Rendered config missing for {{ lab05_router_name }} at {{ lab05_render_dir }}/{{ lab05_router_name }}.set"
      when: not lab05_render_stat.stat.exists

    - name: Fail if collected config is missing
      ansible.builtin.fail:
        msg: "Collected config missing for {{ lab05_router_name }} at {{ lab05_collect_dir }}/{{ lab05_router_name }}.set"
      when: not lab05_collect_stat.stat.exists

    - name: Run unified diff
      ansible.builtin.command:
        cmd: >-
          diff -u
          {{ lab05_collect_dir }}/{{ lab05_router_name }}.set
          {{ lab05_render_dir }}/{{ lab05_router_name }}.set
      register: lab05_diff_cmd
      delegate_to: localhost
      changed_when: lab05_diff_cmd.rc == 1
      failed_when: lab05_diff_cmd.rc not in [0, 1]

    - name: Write diff report
      ansible.builtin.copy:
        dest: "{{ lab05_diff_dir }}/{{ lab05_router_name }}.diff"
        mode: "0644"
        content: |
          ## Lab 05 diff report for {{ lab05_router_name }}
          ## Inventory host: {{ inventory_hostname }}
          ## Return code: {{ lab05_diff_cmd.rc }}
          ## Meaning:
          ##   0 = no differences
          ##   1 = differences found

          {{ lab05_diff_cmd.stdout | default('') }}
      delegate_to: localhost

    - name: Show diff status
      ansible.builtin.debug:
        msg: >-
          {{
            'No differences for ' ~ lab05_router_name
            if lab05_diff_cmd.rc == 0
            else 'Differences found for ' ~ lab05_router_name ~
                 '; see ' ~ lab05_diff_dir ~ '/' ~ lab05_router_name ~ '.diff'
          }}