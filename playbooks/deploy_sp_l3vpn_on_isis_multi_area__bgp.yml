---
- name: Deploy BGP overlay configs for SP L3VPN lab
  hosts: r2:r3:r5
  gather_facts: false
  connection: local

  vars:
    junos_user: jcluser

  vars_prompt:
    - name: DEVICE_PASSWORD
      prompt: "Device password"
      private: yes

  tasks:
    - name: Push BGP overlay config with set
      juniper.device.config:
        host: "{{ ansible_host }}"
        user: "{{ junos_user }}"
        passwd: "{{ DEVICE_PASSWORD }}"
        port: "{{ ansible_port }}"
        ssh_config: "/tmp/blank_ssh_config"
        src: "{{ playbook_dir }}/../rendered/isis_multi_area/bgp/lab-{{ inventory_hostname }}.set"
        load: set
        comment: "Deploy SP L3VPN BGP overlay"